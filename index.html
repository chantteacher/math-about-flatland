<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flatland 탐구 코치</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f0e3;--grid:#eadfca;--ink:#3b2f2a;--sub:#7a6558;--paper:#fffaf0;--line:#e0d3bd;--acc:#a65406;--onacc:#fff;--note:#ffe9b0;--noteink:#6b4300;--ok:#2f7d3e;--bad:#b53a1a;--chip:#f0e3cb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c17;--grid:#2f251e;--ink:#f3e8d8;--sub:#c4b09a;--paper:#2e241d;--line:#4a3b30;--acc:#f0a64c;--onacc:#2a1c0c;--note:#4a3a18;--noteink:#f6d98b;--ok:#7fd18a;--bad:#ff9c7a;--chip:#3b2e24}}
:root[data-theme="dark"]{--bg:#241c17;--grid:#2f251e;--ink:#f3e8d8;--sub:#c4b09a;--paper:#2e241d;--line:#4a3b30;--acc:#f0a64c;--onacc:#2a1c0c;--note:#4a3a18;--noteink:#f6d98b;--ok:#7fd18a;--bad:#ff9c7a;--chip:#3b2e24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;letter-spacing:.01em;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.65 "Gowun Dodum","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{font-family:"Gowun Batang",serif;margin:0}
h1{font-size:1.9rem;line-height:1.3}
.lead{color:var(--sub);margin:6px 0 16px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button.done::after{content:" ✓";color:var(--ok)}
nav button.on.done::after{color:var(--bg)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sec{margin-top:22px}
.tip{background:var(--paper);border:1px dashed var(--acc);padding:12px 14px;border-radius:6px;font-size:.95rem;margin:12px 0}
.fld{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;margin:18px 0}
.fld h3{font-size:1.15rem}
.q{margin:4px 0 10px;color:var(--sub);font-size:.95rem}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:4px;padding:6px 10px;font:inherit;color:var(--ink);line-height:2rem;background:var(--paper) repeating-linear-gradient(transparent,transparent calc(2rem - 1px),var(--line) calc(2rem - 1px),var(--line) 2rem);background-attachment:local}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.bar button,.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 11px;border-radius:5px;font:inherit;font-size:.85rem;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700;padding:9px 18px;font-size:.95rem}
.hint{background:var(--note);color:var(--noteink);padding:9px 12px;border-radius:4px;margin:6px 0;font-size:.93rem}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 2px}
.chips span{font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--sub)}
.chips span.hit{background:var(--acc);color:var(--onacc)}
.msg{font-size:.88rem;color:var(--sub);margin-top:4px}
.msg b{color:var(--ok)}
.w{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;margin:14px 0}
.w svg{width:100%;max-width:520px;display:block;margin:0 auto}
.w input[type=range]{width:100%}
.lab{text-align:center;font-weight:700;font-family:"Gowun Batang",serif;font-size:1.1rem;margin-top:4px}
.topics label{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:5px;margin:6px 0;cursor:pointer;font-size:.93rem}
.topics input{margin-right:8px}
.topics label.on{border-color:var(--acc);background:var(--chip)}
table.r{width:100%;border-collapse:collapse;margin:8px 0}
table.r td,table.r th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;font-size:.93rem}
.rep{background:#fffdf8;color:#2b211c;padding:28px;border:1px solid #bbb;border-radius:4px;font-family:"Gowun Batang",serif;line-height:1.85}
.rep h2{font-size:1.4rem;border-bottom:2px solid #8a4b0f;padding-bottom:6px;margin-bottom:12px}
.rep h3{font-size:1.05rem;margin:18px 0 4px}
.rep .qq{font-family:"Gowun Dodum",sans-serif;font-size:.82rem;color:#555;margin:0 0 4px}
.rep p{margin:0 0 6px;white-space:pre-wrap}
.empty{color:#a33}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
.name input{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 9px;border-radius:4px;font:inherit;width:140px}
.sess{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.sess i{display:block;font-style:normal;color:var(--sub);font-size:.72rem}.sess b{font-size:.98rem}
.sess input{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 9px;border-radius:4px;font:inherit;width:130px}
.nocopy{-webkit-user-select:none;user-select:none}
.locked{opacity:.4;pointer-events:none;user-select:none}
.mk{display:flex;gap:5px;flex-wrap:wrap;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0}
.mk button{min-width:38px;height:36px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font:inherit;font-size:1.02rem;cursor:pointer}
.mk button:active{background:var(--acc);color:var(--onacc)}
.mk .sp{flex-basis:100%;height:0}
@media print{body{background:#fff}nav,.sess,.row,.lead,h1,.noprint{display:none!important}.rep{border:0;padding:0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<h1>Flatland 탐구 코치</h1>
<p class="lead">답을 대신 써 주지 않아요. 힌트를 한 단계씩 열고, 핵심 용어와 논리 연결을 채우면 보고서 문장이 완성됩니다.</p>

<main id="main"></main>

<script>
const QTXT={
q1:"원뿔을 자르는 평면의 기울기를 바꾸면 단면이 원→타원→포물선→쌍곡선으로 변한다. 이를 ‘구가 플랫랜드를 통과하며 원의 크기가 변하는 장면’과 비교하여 공통점과 차이점을 서술하시오.",
q2a:"x²+y²+z²=r²에 z=k를 대입하여 단면의 방정식을 구하고, 단면이 어떤 도형이며 반지름이 k에 따라 어떻게 변하는지 쓰시오. (|k|&lt;r)",
q2b:"|k|>r일 때 단면이 존재하지 않는 것은 영화의 어떤 장면에 해당하는지 서술하시오."};
const F={
dimL1:{t:"라인랜드(1차원) · 인식 가능한 것",q:"축이 1개뿐인 세계에서 마주칠 수 있는 것은?",min:20,kw:["1개","직선","점","선분","앞","뒤","길이","거리"],h:["움직일 수 있는 방향이 몇 가지인지 세어 보자.","한 줄 위에서는 앞·뒤 두 방향뿐이라 이웃의 가까운 쪽 끝만 보인다. 상대가 선분이어도 점으로 인식된다.","‘점으로 인식 / 앞뒤 방향 / 이웃과의 거리·순서’를 넣어 한 문장으로 써 보자. 길이를 알 수 없다는 점도 좋아요."]},
dimL2:{t:"라인랜드 · 인식 불가능한 것",q:"선 위의 존재에게 아예 없는 개념은?",min:20,kw:["두 번째","폭","넓이","2차원","축","밖"],h:["직선에 없는 방향은 무엇일까? 옆 방향이다.","옆 방향이 없으면 ‘폭’이나 ‘넓이’라는 개념도 만들 수 없다.","‘두 번째 축이 없기 때문에 ~를 인식할 수 없다’ 형태로 이유(축의 개수)를 붙이자."]},
dimF1:{t:"플랫랜드(2차원) · 인식 가능한 것",q:"x축·y축 두 개가 있는 세계에서는?",min:20,kw:["평면","2개","원","다각형","변","넓이","좌우","앞뒤"],h:["축이 2개면 방향은 앞뒤+좌우. 어떤 도형이 존재할 수 있을까?","플랫랜드 주민은 평면 안에서 이웃을 본다. 이웃 도형은 어떻게 보일까?","‘평면, 축 2개, 도형의 변·넓이’를 포함하고, 도형이 ‘선분처럼’ 보인다는 점도 넣어 보자."]},
dimF2:{t:"플랫랜드 · 인식 불가능한 것",q:"평면 세계에 없는 방향은?",min:20,kw:["위","아래","높이","z축","3차원","단면","입체"],h:["x, y 말고 또 하나의 방향이 있다면?","‘위·아래(높이)’ 방향을 모르니 입체의 전체 모습을 알 수 없다.","‘세 번째 축(z축)이 없어서 ~를 인식 못 한다. 대신 ~만 본다’ 로 단면과 연결하자."]},
dimS1:{t:"스페이스랜드(3차원) · 인식 가능한 것",q:"x, y, z 세 축이 있는 세계에서는?",min:20,kw:["3차원","공간","z축","입체","구","부피","높이","평면"],h:["축이 3개면 도형은 어떻게 달라질까? 점·선·면 다음 단계는?","입체(구, 정육면체 등)와 부피를 인식한다. 2차원 세계를 ‘위에서’ 내려다볼 수도 있다.","‘3차원, 입체·부피, 하위 차원 세계를 한눈에 봄’을 넣어 보자."]},
dimS2:{t:"스페이스랜드 · 인식 불가능한 것",q:"3차원 존재가 느끼지 못하는 것은?",min:20,kw:["4차원","네 번째","w","상상","감각","축"],h:["플랫랜드가 ‘세 번째 축’을 못 보듯, 우리가 못 보는 것은?","네 번째 축 방향과 4차원 도형의 전체 모습이다.","‘네 번째 축이 없으므로 ~를 직접 감각할 수 없다’ 로 앞의 패턴을 반복해 보자."]},
q1:{t:"QUIZ 1 · 단면 비교",q:QTXT.q1,min:120,kw:["단면","평면","원뿔","구","원","타원","포물선","쌍곡선","기울기","크기","공통","차이"],h:["공통점부터: 둘 다 ‘고차원 도형을 평면으로 자른 단면’을 본다.","차이점 찾기: 구 장면에서는 평면의 ‘무엇’이 바뀌고 ‘무엇’이 변할까? 원뿔은? (위치 vs 기울기, 크기 vs 종류)","뼈대: 공통(단면) → 차이①(바뀌는 조건) → 차이②(결과) → 한 줄 결론. 위 슬라이더로 직접 확인한 뒤 써 보자."]},
q2a:{t:"QUIZ 2-1 · 단면의 방정식",q:QTXT.q2a,min:60,kw:["원","반지름","√","r²","k²","중심","최대","0","z=k"],h:["대입하면 z² 자리에 k²이 들어간다. 식이 어떻게 바뀔까?","x²+y² = (r²−k²) 꼴이 된다. 이 꼴은 어떤 도형의 방정식일까? 중심 좌표도 확인해 보자.","k=0일 때와 |k|가 r에 가까워질 때 반지름을 각각 직접 계산해 보자. 슬라이더로 검산!"]},
q2b:{t:"QUIZ 2-2 · 단면이 없는 경우",q:QTXT.q2b,min:60,kw:["단면","없","만나지","인식","사라","통과","지나","플랫랜드"],h:["|k|>r이면 r²−k²의 부호는?","x, y가 실수일 때 x²+y²가 음수가 될 수 있을까? 그렇다면 평면과 구는?","구가 평면에 닿기 전, 또는 완전히 통과한 뒤 플랫랜드 주민이 보는 것은? 영화 장면과 연결하자."]}
};
const T=[
{t:"1) 점의 왕에게 설명 실패",q:"정사각형이 포인트랜드의 왕에게 2차원 세계를 설명하지 못한 이유를 수학적 개념(정보량, 축의 차이)으로 설명하라.",kw:["정보량","축","0차원","2차원","좌표","점","설명","인식","소통"],h:["점의 왕이 가진 좌표(축)는 몇 개일까?","‘넓이’, ‘옆’ 같은 말은 축이 0개인 세계에 정의된 개념일까?","정보량(필요 좌표 0 vs 2) → 개념 공유 불가 → 설득 실패 순서로 쓰고, 4차원 설명과의 유사성으로 확장하자."]},
{t:"2) 변의 수로 나뉘는 신분",q:"변의 수에 따라 신분이 나뉘는 설정이 기하학적 규칙성과 사회 풍자를 어떻게 결합하는지 설명하라.",kw:["변의 수","계급","정다각형","원","풍자","위계","규칙","차별","사회"],h:["변의 수는 수학적으로 객관적으로 셀 수 있다. 그 성질이 신분 기준이 되면?","객관적 규칙이 차별을 ‘자연스럽게’ 보이게 만드는 점을 생각해 보자.","‘기하의 정확성 ↔ 차별의 정당화’ 한 쌍을 중심으로 현실 사례 하나를 연결하자."]},
{t:"3) 4차원은 왜 상상이 어려울까",q:"우리가 4차원을 수학적으로는 다루지만 감각적으로는 상상하기 어려운 이유를 좌표축의 개수 관점에서 설명하라.",kw:["좌표축","4개","3개","w","감각","상상","수식","단면","투영","차원"],h:["우리 몸이 경험한 독립 방향은 몇 개일까?","수학은 (x,y,z,w)처럼 좌표 하나만 더 쓰면 되지만, w 방향은 경험한 적이 없다.","플랫랜드 주민이 구를 단면으로만 알듯, 우리는 4차원을 3차원 단면·투영으로만 접근한다는 점과 연결하자."]}];
